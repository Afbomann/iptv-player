name: Build and publish GitHub release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, e.g. 0.1.1
        required: true
      build:
        description: Increasing positive build number, same across platforms
        required: true
      android:
        description: Build signed Android APK (requires signing secrets)
        type: boolean
        default: true
      publish:
        description: Publish installers and signed update feed to GitHub Releases
        type: boolean
        default: true
concurrency:
  group: lumen-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      LUMEN_UPDATE_URL: https://github.com/Afbomann/iptv-player/releases/latest/download/updates.json
      LUMEN_UPDATE_PUBLIC_KEY: ${{ vars.LUMEN_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version inputs
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$RELEASE_BUILD" =~ ^[1-9][0-9]*$ ]] || exit 1
          test -n "$LUMEN_UPDATE_PUBLIC_KEY" || { echo 'Set repository variable LUMEN_UPDATE_PUBLIC_KEY before building release packages'; exit 1; }
      - uses: actions/setup-java@v4
        if: matrix.target == 'android' && inputs.android
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android' && inputs.android
      - name: Linux libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: oven-sh/setup-bun@v2
        if: matrix.target == 'web'
      - name: Build browser assets and test release tooling
        if: matrix.target == 'web'
        run: |
          bun install --frozen-lockfile
          bun run build:video
          node --test tooling/release-manifest.test.mjs
      - run: flutter pub get
      - name: Test
        if: matrix.target == 'web'
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Desktop/web candidate
        if: matrix.target != 'android'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extra=()
          flutter build "$TARGET" --release --no-pub "${extra[@]}" --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD" --dart-define="LUMEN_VERSION=$RELEASE_VERSION" --dart-define="LUMEN_BUILD_NUMBER=$RELEASE_BUILD" --dart-define="LUMEN_UPDATE_URL=$LUMEN_UPDATE_URL" --dart-define="LUMEN_UPDATE_PUBLIC_KEY=$LUMEN_UPDATE_PUBLIC_KEY"
      - name: Signed Android packages
        if: matrix.target == 'android' && inputs.android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LUMEN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Android signing secrets are required'; exit 1; }
          export LUMEN_ANDROID_KEYSTORE="$RUNNER_TEMP/lumen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LUMEN_ANDROID_KEYSTORE"
          for target in apk; do
            flutter build "$target" --release --no-pub --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD" --dart-define="LUMEN_VERSION=$RELEASE_VERSION" --dart-define="LUMEN_BUILD_NUMBER=$RELEASE_BUILD" --dart-define="LUMEN_UPDATE_URL=$LUMEN_UPDATE_URL" --dart-define="LUMEN_UPDATE_PUBLIC_KEY=$LUMEN_UPDATE_PUBLIC_KEY"
          done
      - name: Linux installer
        if: matrix.target == 'linux'
        run: node tooling/package-linux.mjs "$RELEASE_VERSION" "$RELEASE_BUILD"
      - name: Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is required on this runner.' }
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DBuildRoot=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" "/DOutputRoot=$env:GITHUB_WORKSPACE\distribution\out" distribution/windows/lumen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: matrix.target != 'android' || inputs.android
        with:
          name: lumen-${{ matrix.target }}-${{ inputs.version }}-${{ inputs.build }}
          if-no-files-found: error
          path: |
            build/web/
            build/linux/x64/release/bundle/
            build/windows/x64/runner/Release/
            build/app/outputs/flutter-apk/*release.apk
            distribution/out/*.exe
            distribution/out/*.deb
  publish:
    needs: candidate
    if: inputs.publish && inputs.android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-*
          path: release-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and sign release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
          LUMEN_RELEASE_PRIVATE_KEY: ${{ secrets.LUMEN_RELEASE_PRIVATE_KEY }}
          LUMEN_UPDATE_PUBLIC_KEY: ${{ vars.LUMEN_UPDATE_PUBLIC_KEY }}
        run: node tooling/prepare-github-release.mjs
      - name: Create draft, upload all files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Afbomann/iptv-player
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Lumen $RELEASE_VERSION" --notes-file release-output/notes.md
          gh release upload "$tag" release-output/lumen-android.apk release-output/lumen-windows-x64-setup.exe release-output/lumen-linux-amd64.deb release-output/updates.json release-output/SHA256SUMS
          gh release edit "$tag" --draft=false --latest
