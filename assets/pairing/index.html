<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect to Lumen</title><style>body{background:#101714;color:#eef2e9;font:17px system-ui;max-width:440px;margin:8vh auto;padding:24px}h1{font-size:40px;letter-spacing:-2px}small{color:#b2c3b6}label{display:block;margin:20px 0 8px}input,select,button{box-sizing:border-box;width:100%;padding:15px;border:1px solid #40554a;border-radius:10px;background:#1b2921;color:inherit;font:inherit}button{margin-top:28px;background:#d5ed9c;color:#172015;cursor:pointer}#status{line-height:1.5}</style></head><body><small>LUMEN / DEVICE SETUP</small><h1>A little less typing.</h1><p>Add your playlist here, then confirm on your TV.</p><form id="setup"><label>Playlist type</label><select name="type"><option value="m3u">M3U URL</option><option value="xtream">Xtream Codes</option></select><label>Name</label><input name="name" required maxlength="100" autocomplete="off"><label>Provider URL</label><input name="url" type="url" required placeholder="https://your-provider.example"><label>Username (Xtream)</label><input name="username" autocomplete="off"><label>Password (Xtream)</label><input name="password" type="password" autocomplete="new-password"><button>Send to TV</button></form><p id="status" role="status"></p><script src="/pairing.js"></script></body></html>
