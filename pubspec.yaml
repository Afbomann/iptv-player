name: lumen_iptv
description: A local-first IPTV library, guide, and player.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  http: ^1.5.0
  xml: ^6.6.1
  archive: ^4.0.7
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  video_player: ^2.14.0
  video_player_tvos: 0.0.1
  path_provider_tvos: 0.0.3
  flutter_secure_storage_tvos: 0.0.2
  flutter_vlc_player: ^7.4.3
  file_picker: ^10.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  web: ^1.1.1
dev_dependencies:
  image: ^4.10.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^2.9.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/lumen-icon.png
    - assets/branding/lumen-banner.png
    - assets/pairing/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
